# Everything this project already checks by hand, run on every push and pull request.
#
# There was no CI before this. The 180-test suite, the Sites deploy guard and the balance
# sweep were all real and all manual, which meant a 98-file rewrite could open a pull
# request with nothing verifying it. The sweep in particular is the project's whole method
# of knowing whether a rule is any good — running it only when someone remembers is the
# same failure that let docs/balance.md drift three commits behind the code.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # A shallow clone is enough now. The findings check reads no git history - it runs the
      # sweep and compares its output against the committed file.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs the sweep once and asks two things of it: that docs/balance.md says what it
      # currently prints, and that no verdict FAILs. It used to compare commit times, which
      # failed forever on any src/battle change that did not move the numbers - regenerating
      # produced no diff, so nothing could be committed to satisfy it.
      - name: findings match the sweep, and no verdict fails
        run: npm run check:findings

      - name: game tests
        run: npm run test:game

      - name: build
        run: npm run build

      # AFTER the build, because its last case asserts dist/client/index.html,
      # dist/server/index.js and dist/.openai/hosting.json exist - the three artifacts
      # AGENTS.md requires for a Sites handoff. Run before a build it passes only on a
      # machine that happens to have a stale dist/ lying around, which is exactly how it
      # passed locally and failed here.
      - name: sites worker tests
        run: npm run test:sites

